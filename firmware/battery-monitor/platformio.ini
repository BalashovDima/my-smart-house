; Battery voltage monitor — classic ESP32 (ESP32-WROOM)
;
; Platform is pinned: Arduino core 3.x renames ADC attenuation symbols and
; changes analogReadMilliVolts() behaviour. Do not float this version.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Default 1.2 MB app slot is too tight with Wi-Fi + web server. huge_app gives
; 3 MB app / ~0.9 MB LittleFS. Trade-off: no OTA partitions.
board_build.partitions = huge_app.csv
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
