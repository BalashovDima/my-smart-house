services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-8883}:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./deploy/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  server:
    build: .
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      MQTT_URL: ssl://mosquitto:8883
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_TLS_SERVER_NAME: mosquitto
      MQTT_CLIENT_ID: smarthouse-server
      MQTT_USER: ${MQTT_USER:-smarthouse-server}
      MQTT_PASS: ${MQTT_PASS:?set MQTT_PASS in server/.env}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-smarthouse}
      DB_PATH: /data/smarthouse.db
      RETENTION_DAYS: ${RETENTION_DAYS:-180}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./deploy/certs:/certs:ro
      - server-data:/data

volumes:
  mosquitto-data:
  server-data:
